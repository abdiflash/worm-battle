<style>
html, body {
  margin: 0; padding: 0; width: 100%; min-height: 100vh;
  font-family: 'Fredoka', sans-serif; background-color: #1a0f07;
  color: #fff; text-align: center; overflow-x: hidden;

.main-wrapper {

}

h1 { margin: 0 0 15px 0; font-size: 30px; color: #ffca28; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }

.game-card {

button {

button:disabled { background: #4a382c !important; color: #8c7365 !important; cursor: not-allowed; }

input, select {
  padding: 12px; border-radius: 16px; border: 2px solid #5c3a21; margin: 8px auto;

#fullscreen-btn { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.3); border-radius: 12px; padding: 6px 12px; font-size: 12px; }

</div>

<script>
const SUPABASE_URL = "https://huppyicherwdhgxrcyav.supabase.co";
const SUPABASE_KEY = "sb_publishable_OJPFFYPGJrDUkjD-gVMOOw_GET4MdOW";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let realtimeChannel = null, currentJoinedClass = "", isTeacherHost = false;
let score = 0, currentRecordId = null, autoRefreshTimer = null;

let matchTimer = null;
let studentTimerInterval = null;
let timeLeft = 60;
let isMatchActive = false;
let animFrameReqId = null; // Guard untuk mencegah penumpukan loop FPS

function updateTimerHUDPreview() {
  const val = document.getElementById("matchTimerSelect").value;
  document.getElementById("timerHUD").innerText = `⏱️ ${val}s`;
}

/* WEB AUDIO API */
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function initAudio() {
  if (!audioCtx) audioCtx = new AudioContext();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playEatSound() {
  initAudio();
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(400, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.12);
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.12);
}

function playBiteSound() {
  initAudio();
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(280, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.2);
  gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.2);
}

/* THREE.JS 3D ENGINE PRESISE */
let scene, camera, renderer;
let redWorm3D = { meshGroup: null, segments: [], history: [], length: 10, x: -10, z: 0, angle: 0, speed: 0.14, color: 0xff3333 };
let blueWorm3D = { meshGroup: null, segments: [], history: [], length: 10, x: 10, z: 0, angle: Math.PI, speed: 0.14, color: 0x3388ff };
let activeFoods = [];
let lastBiteTime = 0;

function init3DScene() {
  if (animFrameReqId) cancelAnimationFrame(animFrameReqId); // CANCEL PREVIOUS LOOP (ANTI LAG)

  const container = document.getElementById("canvas3DContainer");
  const oldHUD = document.getElementById("timerHUD");
  container.innerHTML = "";
  container.appendChild(oldHUD);
  
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x140b05);

  camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
  camera.position.set(0, 35, 25);
  camera.lookAt(0, 0, 0);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.appendChild(renderer.domElement);

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
  scene.add(ambientLight);
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
  dirLight.position.set(10, 30, 10);
  scene.add(dirLight);

  const groundGeo = new THREE.PlaneGeometry(40, 25);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x1f1108, roughness: 0.8 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  buildWorm3D(redWorm3D, -10, 0);
  buildWorm3D(blueWorm3D, 10, Math.PI);

  animate3D();
}

function createCuteHead(colorHex) {
  const headGroup = new THREE.Group();
  const geo = new THREE.SphereGeometry(0.85, 16, 16);
  const mat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.2 });
  const headMesh = new THREE.Mesh(geo, mat);
  headGroup.add(headMesh);

  const eyeGeo = new THREE.SphereGeometry(0.25, 8, 8);
  const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const pupilGeo = new THREE.SphereGeometry(0.12, 8, 8);
  const pupilMat = new THREE.MeshBasicMaterial({ color: 0x000000 });

  const leftEye = new THREE.Mesh(eyeGeo, eyeMat); leftEye.position.set(-0.35, 0.35, 0.65);
  const leftPupil = new THREE.Mesh(pupilGeo, pupilMat); leftPupil.position.set(-0.35, 0.35, 0.85);
  headGroup.add(leftEye); headGroup.add(leftPupil);

  const rightEye = new THREE.Mesh(eyeGeo, eyeMat); rightEye.position.set(0.35, 0.35, 0.65);
  const rightPupil = new THREE.Mesh(pupilGeo, pupilMat); rightPupil.position.set(0.35, 0.35, 0.85);
  headGroup.add(rightEye); headGroup.add(rightPupil);

  return headGroup;
}

function buildWorm3D(worm, startX, startAngle) {
  if (worm.meshGroup) scene.remove(worm.meshGroup);
  
  worm.meshGroup = new THREE.Group();
  scene.add(worm.meshGroup);
  
  worm.segments = [];
  worm.history = [];
  worm.length = 10;
  worm.x = startX;
  worm.z = 0;
  worm.angle = startAngle;

  // Inisialisasi Riwayat Posisi Kepala
  for(let i=0; i<300; i++) {
    worm.history.push({ x: startX, z: 0, angle: startAngle });
  }

  const bodyMaterial = new THREE.MeshStandardMaterial({ color: worm.color, roughness: 0.3 });

  for(let i=0; i<30; i++) {
    let mesh;
    if(i === 0) {
      mesh = createCuteHead(worm.color);
    } else {
      const scale = Math.max(0.35, 0.75 - (i * 0.012));
      const geo = new THREE.SphereGeometry(scale, 12, 12);
      mesh = new THREE.Mesh(geo, bodyMaterial);
    }
    mesh.position.set(startX, 0.8, 0);
    worm.meshGroup.add(mesh);
    worm.segments.push(mesh);
  }
}

function spawnFoodForTeam(teamColor) {
  const worm = (teamColor === "🔴") ? redWorm3D : blueWorm3D;
  
  const foodGeo = new THREE.SphereGeometry(0.45, 8, 8);
  const foodMat = new THREE.MeshStandardMaterial({ 
    color: (teamColor === "🔴") ? 0xff5252 : 0x2979ff, 
    emissive: 0x444444 
  });
  const mesh = new THREE.Mesh(foodGeo, foodMat);
  
  const foodX = worm.x + Math.cos(worm.angle) * 3;
  const foodZ = worm.z + Math.sin(worm.angle) * 3;
  
  mesh.position.set(foodX, 0.45, foodZ);
  scene.add(mesh);
  
  activeFoods.push({ mesh: mesh, x: foodX, z: foodZ, targetWorm: worm });
}

function animate3D() {
  animFrameReqId = requestAnimationFrame(animate3D);

  if (isMatchActive) {
    let chaser = (redWorm3D.length >= blueWorm3D.length) ? redWorm3D : blueWorm3D;
    let victim = (chaser === redWorm3D) ? blueWorm3D : redWorm3D;

    let dxChaser = victim.x - chaser.x;
    let dzChaser = victim.z - chaser.z;
    chaser.angle = Math.atan2(dzChaser, dxChaser);
    
    victim.angle = chaser.angle + 0.6; // Menghindar memutar

    [redWorm3D, blueWorm3D].forEach(w => {
      let speed = (w === chaser) ? 0.15 : 0.11;
      w.x += Math.cos(w.angle) * speed;
      w.z += Math.sin(w.angle) * speed;

      // Batas Arena (Wrap Teleport Smooth)
      if(w.x < -18) { w.x = 18; wormClearHistory(w); }
      if(w.x > 18) { w.x = -18; wormClearHistory(w); }
      if(w.z < -11) { w.z = 11; wormClearHistory(w); }
      if(w.z > 11) { w.z = -11; wormClearHistory(w); }

      // Tambahkan Posisi Baru ke Riwayat Sejarah Kepala
      w.history.unshift({ x: w.x, z: w.z, angle: w.angle });
      if (w.history.length > 300) w.history.pop();

      // UPDATE SEGMEN BERDASARKAN POSITION HISTORY TRAIL (ANTI TERPUTUS/ANTI LEAK)
      for(let i = 0; i < 30; i++) {
        if(i < w.length) {
          w.segments[i].visible = true;
          let histIdx = i * 5; // Jarak/Gap antar segmen presisi
          let pos = w.history[histIdx] || w.history[w.history.length - 1];
          w.segments[i].position.set(pos.x, 0.8, pos.z);
          if (i === 0) {
            w.segments[i].rotation.y = -pos.angle + Math.PI/2;
          }
        } else {
          w.segments[i].visible = false;
        }
      }
    });

    // MEMANGLAP MAKANAN -> BUNYI EFEK MAKAN
    activeFoods.forEach((f, idx) => {
      if(Math.hypot(f.targetWorm.x - f.x, f.targetWorm.z - f.z) < 1.5) {
        f.targetWorm.length = Math.min(30, f.targetWorm.length + 1);
        playEatSound();
        scene.remove(f.mesh);
        activeFoods.splice(idx, 1);
      }
    });

    // BENTURAN / GIGITAN CACING
    let distBetween = Math.hypot(redWorm3D.x - blueWorm3D.x, redWorm3D.z - blueWorm3D.z);
    if(distBetween < 1.8) {
      let now = Date.now();
      if (now - lastBiteTime > 500) {
        if(redWorm3D.length > blueWorm3D.length && blueWorm3D.length > 5) {
          redWorm3D.length += 1; 
          blueWorm3D.length -= 1;
          playBiteSound();
          lastBiteTime = now;
        } else if(blueWorm3D.length > redWorm3D.length && redWorm3D.length > 5) {
          blueWorm3D.length += 1; 
          redWorm3D.length -= 1;
          playBiteSound();
          lastBiteTime = now;
        }
      }
    }
  }

  document.getElementById("redLength").innerText = redWorm3D.length;
  document.getElementById("blueLength").innerText = blueWorm3D.length;

  renderer.render(scene, camera);
}

function wormClearHistory(worm) {
  worm.history = [];
  for(let i=0; i<300; i++) {
    worm.history.push({ x: worm.x, z: worm.z, angle: worm.angle });
  }
}

async function triggerHostStartMatch() {
  const classCode = document.getElementById("filterClass").value.trim().toUpperCase();
  if (!classCode) return;

  isTeacherHost = true;
  initAudio();
  connectRealtimeChannel(classCode);

  const selectedDuration = parseInt(document.getElementById("matchTimerSelect").value) || 60;

  setTimeout(() => {
    if (realtimeChannel) {
      realtimeChannel.send({ 
        type: 'broadcast', 
        event: 'start_battle',
        payload: { duration: selectedDuration }
      });
      
      init3DScene();
      isMatchActive = true;
      timeLeft = selectedDuration;
      document.getElementById("timerHUD").innerText = `⏱️ ${timeLeft}s`;

      clearInterval(matchTimer);
      matchTimer = setInterval(() => {
        timeLeft--;
        document.getElementById("timerHUD").innerText = `⏱️ ${timeLeft}s`;
        if (timeLeft <= 0) {
          clearInterval(matchTimer);
          endMatchBattle();
        }
      }, 1000);

      if(autoRefreshTimer) clearInterval(autoRefreshTimer);
      autoRefreshTimer = setInterval(renderBoard, 1000);
    }
  }, 300);
}

function endMatchBattle() {
  isMatchActive = false;
  let winnerTitle = "";
  let winningTeamEmoji = "";

  if (redWorm3D.length > blueWorm3D.length) {
    winnerTitle = "🏆 RED WORM WINS THE BATTLE!";
    winningTeamEmoji = "🔴";
  } else if (blueWorm3D.length > redWorm3D.length) {
    winnerTitle = "🏆 BLUE WORM WINS THE BATTLE!";
    winningTeamEmoji = "🔵";
  } else {
    winnerTitle = "🤝 IT'S A DRAW!";
    winningTeamEmoji = "DRAW";
  }

  if (realtimeChannel) {
    realtimeChannel.send({
      type: 'broadcast',
      event: 'end_battle',
      payload: {
        winnerTitle: winnerTitle,
        winningTeamEmoji: winningTeamEmoji,
        redLength: redWorm3D.length,
        blueLength: blueWorm3D.length
      }
    });
  }

  munculkanAlert("🏁 TIME'S UP!", `${winnerTitle}<br><br>Red Worm Length: <b>${redWorm3D.length} seg</b><br>Blue Worm Length: <b>${blueWorm3D.length} seg</b>`);
}

function cekInput() {
  const nama = document.getElementById("name").value.trim();
  const kelas = document.getElementById("class").value.trim().toUpperCase();
  const team = document.getElementById("teamSelect").value;
  const startBtn = document.getElementById("startBtn");
  const createClassBtn = document.getElementById("createClassBtn");
  const scoreboardBtn = document.getElementById("scoreboardBtn");

  if (team !== "") {
    createClassBtn.disabled = true; createClassBtn.style.display = "none";
    scoreboardBtn.disabled = true; scoreboardBtn.style.display = "none";

    if (nama !== "" && kelas !== "") {
      startBtn.disabled = true; startBtn.innerText = "⏳ WAITING FOR TEACHER...";
      connectRealtimeChannel(kelas, nama, team);
    }
  } else {
    if (!isTeacherHost) {
      createClassBtn.disabled = false; createClassBtn.style.display = "block";
      scoreboardBtn.disabled = false; scoreboardBtn.style.display = "inline-block";
    }
    startBtn.disabled = !(nama !== "" && kelas !== "");
    startBtn.innerText = "START GAME";
  }
}

function connectRealtimeChannel(classCode, pName = "", pTeam = "") {
  if (currentJoinedClass === classCode && realtimeChannel) {
    if (pName !== "") realtimeChannel.track({ name: pName, team: pTeam });
    return;
  }
  if (realtimeChannel) supabaseClient.removeChannel(realtimeChannel);
  currentJoinedClass = classCode;

  realtimeChannel = supabaseClient.channel('class-' + classCode, {
    config: { presence: { key: pName || 'host' } }
  });

  realtimeChannel
    .on('presence', { event: 'sync' }, () => updateLobbyUI(realtimeChannel.presenceState()))
    .on('broadcast', { event: 'start_battle' }, (payload) => {
      if (!isTeacherHost) {
        const dur = (payload && payload.payload && payload.payload.duration) ? payload.payload.duration : 60;
        startQuizForStudent(dur);
      }
    })
    .on('broadcast', { event: 'student_correct_answer' }, (payload) => {
      if (isTeacherHost) {
        spawnFoodForTeam(payload.payload.team);
      }
    })
    .on('broadcast', { event: 'end_battle' }, (payload) => {
      if (!isTeacherHost) {
        handleStudentGameOver(payload.payload);
      }
    })
    .subscribe(async (status) => {
      if (status === 'SUBSCRIBED' && pName !== "") {
        await realtimeChannel.track({ name: pName, team: pTeam });
      }
    });
}

function updateLobbyUI(state) {
  let redP = [], blueP = [];
  Object.keys(state).forEach(k => {
    state[k].forEach(p => {
      if (p.team === "🔴") redP.push(p.name);
      if (p.team === "🔵") blueP.push(p.name);
    });
  });

  document.getElementById("redTeamList").innerHTML = redP.map(n => `<div class="player-tag tag-red">🔴 ${n}</div>`).join('');
  document.getElementById("blueTeamList").innerHTML = blueP.map(n => `<div class="player-tag tag-blue">🔵 ${n}</div>`).join('');
}

function syncHostChannel() {
  const classCode = document.getElementById("filterClass").value.trim().toUpperCase();
  renderBoard();
  if (classCode !== "") {
    isTeacherHost = true;
    connectRealtimeChannel(classCode);
  }
}

let currentAns = 0;
function startQuizForStudent(duration) {
  document.getElementById("top-menu").classList.add("hidden");
  document.getElementById("quizArea").classList.remove("hidden");
  
  let studentTimeLeft = duration;
  document.getElementById("studentTimerDisplay").innerText = `⏱️ Time: ${studentTimeLeft}s`;
  
  clearInterval(studentTimerInterval);
  studentTimerInterval = setInterval(() => {
    studentTimeLeft--;
    if (studentTimeLeft >= 0) {
      document.getElementById("studentTimerDisplay").innerText = `⏱️ Time: ${studentTimeLeft}s`;
    } else {
      clearInterval(studentTimerInterval);
    }
  }, 1000);

  generateQuiz();
}

function generateQuiz() {
  let n1 = Math.floor(Math.random() * 20) + 1;
  let n2 = Math.floor(Math.random() * 20) + 1;
  currentAns = n1 + n2;
  document.getElementById("questionText").innerText = `${n1} + ${n2} = ?`;

  let opts = [currentAns, currentAns + 2, currentAns - 1, currentAns + 5].sort(() => Math.random() - 0.5);
  let html = "";
  opts.forEach(o => {
    html += `<button class="btn-blue" onclick="checkAnswer(${o})">${o}</button>`;
  });
  document.getElementById("answerOptions").innerHTML = html;
}

async function checkAnswer(val) {
  let team = document.getElementById("teamSelect").value;
  if (val === currentAns) {
    score += 10;
    document.getElementById("quizMsg").innerHTML = "<span style='color:#4caf50;'>✨ CORRECT! +10 (FOOD SPAWNED FOR WORM!)</span>";
    
    if (realtimeChannel) {
      realtimeChannel.send({
        type: 'broadcast',
        event: 'student_correct_answer',
        payload: { team: team }
      });
    }

    syncScoreToDatabase();
  } else {
    document.getElementById("quizMsg").innerHTML = "<span style='color:#ff5252;'>❌ WRONG!</span>";
  }
  setTimeout(() => {
    document.getElementById("quizMsg").innerHTML = "";
    generateQuiz();
  }, 800);
}

function handleStudentGameOver(data) {
  clearInterval(studentTimerInterval);
  const myTeam = document.getElementById("teamSelect").value;
  let resultStatusText = "";

  if (data.winningTeamEmoji === "DRAW") {
    resultStatusText = "🤝 GAME DRAW!";
  } else if (data.winningTeamEmoji === myTeam) {
    resultStatusText = "🎉 YOUR TEAM WON THE BATTLE!";
  } else {
    resultStatusText = "💔 YOUR TEAM LOST!";
  }

  const alertCloseBtn = document.getElementById("alertCloseBtn");
  alertCloseBtn.innerText = "🔄 Reset & Ready for Next Round";
  alertCloseBtn.onclick = resetStudentToLobby;

  munculkanAlert("🏁 TIME'S UP!", 
    `<b style='font-size:20px; color:#ffca28;'>${resultStatusText}</b><br><br>` +
    `Your Final Score: <b style='color:#4caf50; font-size:24px;'>${score}</b><br>` +
    `<small>Red Worm: ${data.redLength} seg | Blue Worm: ${data.blueLength} seg</small>`
  );
}

function resetStudentToLobby() {
  tutupAlert();
  document.getElementById("quizArea").classList.add("hidden");
  document.getElementById("top-menu").classList.remove("hidden");
  
  const alertCloseBtn = document.getElementById("alertCloseBtn");
  alertCloseBtn.innerText = "Close";
  alertCloseBtn.onclick = tutupAlert;

  score = 0;
  currentRecordId = null;
  cekInput();
}

async function syncScoreToDatabase() {
  let pName = document.getElementById("name").value.trim();
  let pTeam = document.getElementById("teamSelect").value;
  let pClass = document.getElementById("class").value.trim().toUpperCase();

  if(!currentRecordId) {
    const { data } = await supabaseClient.from("scores").insert([{
      name: pTeam + " " + pName, class: pClass, score: score, mode: "3dworm"
    }]).select();
    if(data && data.length > 0) currentRecordId = data[0].id;
  } else {
    await supabaseClient.from("scores").update({ score: score }).eq("id", currentRecordId);
  }
}

async function renderBoard() {
  const filter = document.getElementById("filterClass").value.trim().toUpperCase();
  let query = supabaseClient.from("scores").select("*").neq("name", "HOST_PIN");
  if(filter !== "") query = query.ilike("class", filter);
  
  let { data } = await query.order("score", { ascending:false }).limit(10);
  if(!data) return;

  document.getElementById("leaderboard").innerHTML = "<b>🏆 TOP PLAYERS</b><hr style='border:1px solid #3d2311;'>" +
    data.map((d,i) => `<div><b>${i+1}.</b> ${d.name} - <b style='color:#ffca28;'>${d.score}</b></div>`).join('');
}

function toggleBoard() {
  document.getElementById("boardPanel").classList.toggle("hidden");
  if(!document.getElementById("boardPanel").classList.contains("hidden")) {
    init3DScene();
    updateTimerHUDPreview();
  }
}

function bukaModalBuatKelas() { document.getElementById("modal-buat-kelas").style.display = "flex"; }
function tutupModalBuatKelas() { document.getElementById("modal-buat-kelas").style.display = "none"; }

async function prosesBuatKelas() {
  const pin = document.getElementById("input-pin-baru").value;
  if(pin.length < 3) return;

  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; 
  let code = "";
  for(let i=0; i<5; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));

  tutupModalBuatKelas();

  await supabaseClient.from("scores").insert([{ name: "HOST_PIN", class: code, score: 0, mode: pin }]);

  isTeacherHost = true;
  document.getElementById("createClassBtn").style.display = "none";
  document.getElementById("scoreboardBtn").style.display = "none";
  document.getElementById("top-menu").style.display = "none"; 
  document.getElementById("boardPanel").classList.remove("hidden");
  document.getElementById("filterClass").value = code;
  syncHostChannel();
  
  munculkanAlert("✅ Class Created!", `Class Code: <b style='font-size:32px; color:#ffca28;'>${code}</b>`);
}

function munculkanAlert(j, p) {
  document.getElementById("alert-title").innerHTML = j;
  document.getElementById("alert-msg").innerHTML = p;
  document.getElementById("custom-alert").style.display = "flex";
}
function tutupAlert() { document.getElementById("custom-alert").style.display = "none"; }
</script>
</body>
</html>
