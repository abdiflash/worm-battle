<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Cute Worm Battle Class Arena</title>

<!-- Fun Font for Kids -->
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
html, body {
  margin: 0; padding: 0; width: 100%; min-height: 100vh;
  font-family: 'Fredoka', sans-serif; background-color: #1a0f07;
  color: #fff; text-align: center; overflow-x: hidden;
}

.main-wrapper {
  width: 100%; max-width: 650px; margin: 0 auto; padding: 30px 15px; box-sizing: border-box;
}

h1 { margin: 0 0 15px 0; font-size: 30px; color: #ffca28; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }

.game-card {
  background: rgba(45, 26, 14, 0.95); border-radius: 24px; padding: 25px 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 3px solid #4a2d18; margin-bottom: 20px; position: relative;
}

button {
  font-family: 'Fredoka', sans-serif; font-size: 16px; font-weight: 700;
  padding: 12px 20px; margin: 5px; border-radius: 16px; border: none; cursor: pointer; transition: 0.15s; color: #fff;
}
button:active:not(:disabled) { transform: translateY(4px); }
button:disabled { background: #4a382c !important; color: #8c7365 !important; cursor: not-allowed; }

.btn-green { background: #4caf50; box-shadow: 0 5px 0 #2e7d32; }
.btn-orange { background: #ff9800; box-shadow: 0 5px 0 #ef6c00; }
.btn-blue { background: #2979ff; box-shadow: 0 5px 0 #1565c0; }
.btn-purple { background: #9c27b0; box-shadow: 0 5px 0 #6a1b9a; font-size: 18px; padding: 14px 28px; width: 90%; }
.btn-red { background: #ff5252; box-shadow: 0 5px 0 #c62828; }

input, select {
  padding: 12px; border-radius: 16px; border: 2px solid #5c3a21; margin: 8px auto;
  width: 90%; max-width: 320px; font-size: 16px; font-family: 'Fredoka', sans-serif;
  text-align: center; box-sizing: border-box; background: #140b05; color: #fff; display: block;
}

/* 3D WORM CANVAS CONTAINER */
#canvas3DContainer {
  width: 100%; height: 320px; border-radius: 20px; border: 3px solid #ffca28;
  overflow: hidden; margin: 15px 0; background: #000; position: relative;
}

.lobby-container { display: flex; justify-content: space-between; gap: 10px; margin-top: 15px; }
.team-column { width: 48%; background: #140b05; border-radius: 16px; padding: 10px; border: 2px solid #3d2311; box-sizing: border-box; }
.player-tag-list { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.player-tag { padding: 4px 10px; border-radius: 10px; font-size: 12px; font-weight: 600; color: #fff; }
.tag-red { background: #ff5252; } .tag-blue { background: #2979ff; }

.modal-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:9999; justify-content:center; align-items:center; }
.modal-box { background: #2d1a0e; padding: 25px; border-radius: 24px; width: 90%; max-width: 340px; border: 3px solid #ffca28; text-align: center; }
.hidden { display: none !important; }

#fullscreen-btn { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.3); border-radius: 12px; padding: 6px 12px; font-size: 12px; }
</style>
</head>

<body>
<button id="fullscreen-btn">🔍 Full Screen</button>

<div class="main-wrapper">
  <h1>🪱 3D Worm Battle Arena</h1>

  <!-- STUDENT MENU -->
  <div id="top-menu" class="game-card">
    <button id="createClassBtn" class="btn-orange" onclick="bukaModalBuatKelas()" style="width: 100%; margin-bottom:15px;">
      👨‍🏫 TEACHER: CREATE CLASS CODE
    </button>

    <div style="background: #140b05; padding: 15px; border-radius: 16px; border: 2px dashed #ffca28; margin-bottom: 15px;">
      <h3 style="color: #ffca28; margin-top:0;">🎮 STUDENT JOIN</h3>
      <input id="class" placeholder="ENTER CLASS CODE..." oninput="cekInput()" style="text-transform: uppercase;">
      <input id="name" placeholder="ENTER YOUR NAME..." oninput="cekInput()">
      
      <select id="teamSelect" onchange="cekInput()">
        <option value="">👤 Play Individual</option>
        <option value="🔴">🔴 Red Worm Team</option>
        <option value="🔵">🔵 Blue Worm Team</option>
      </select>
    </div>

    <button id="scoreboardBtn" class="btn-blue" onclick="toggleBoard()">📊 Scoreboard</button>
    <button id="startBtn" class="btn-purple" onclick="startGame()" disabled>START GAME</button>
  </div>

  <!-- QUIZ AREA SISWA -->
  <div id="quizArea" class="game-card hidden">
    <h2 id="questionText" style="color:#ffca28;">Loading question...</h2>
    <div id="answerOptions" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:15px;"></div>
    <div id="quizMsg" style="margin-top:15px; font-weight:bold;"></div>
  </div>

  <!-- LIVEBOARD GURU (PROYEKTOR 3D WORM BATTLE) -->
  <div id="boardPanel" class="game-card hidden">
    <h3>📊 Live 3D Worm Arena</h3>
    
    <div style="display:flex; justify-content:center; gap:5px; margin-bottom:10px;">
      <input id="filterClass" placeholder="CLASS CODE..." style="width:50%; margin:0; text-transform: uppercase;" oninput="syncHostChannel()">
      <button class="btn-blue" onclick="renderBoard()" style="margin:0;">Search</button>
    </div>

    <button id="hostStartBtn" class="btn-green" onclick="triggerHostStartMatch()" style="width: 100%; font-size: 16px; padding: 12px; margin-bottom: 10px;">
      🚀 START WORM BATTLE (ALL STUDENTS)
    </button>

    <!-- CONTAINER THREE.JS 3D -->
    <div id="canvas3DContainer"></div>

    <div class="lobby-container">
      <div class="team-column" style="border-color: #ff5252;">
        <h4 style="color: #ff5252; margin:0 0 5px 0;">🔴 Red Worm (<span id="redLength">10</span> seg)</h4>
        <div id="redTeamList" class="player-tag-list"></div>
      </div>
      <div class="team-column" style="border-color: #2979ff;">
        <h4 style="color: #2979ff; margin:0 0 5px 0;">🔵 Blue Worm (<span id="blueLength">10</span> seg)</h4>
        <div id="blueTeamList" class="player-tag-list"></div>
      </div>
    </div>
    
    <div id="leaderboard" style="text-align:left; background:#140b05; padding:12px; border-radius:12px; margin-top:15px;"></div>
  </div>
</div>

<!-- MODALS -->
<div id="custom-alert" class="modal-overlay">
  <div class="modal-box"><h2 id="alert-title">Info</h2><p id="alert-msg"></p><button class="btn-blue" onclick="tutupAlert()" style="width:100%;">Close</button></div>
</div>
<div id="modal-buat-kelas" class="modal-overlay">
  <div class="modal-box"><h2 style="color:#ff9800;">👨‍🏫 Create Class</h2><input type="text" id="input-pin-baru" placeholder="Enter PIN"><div style="display:flex; gap:10px; margin-top:15px;"><button class="btn-red" onclick="tutupModalBuatKelas()" style="width:50%;">Cancel</button><button class="btn-green" onclick="prosesBuatKelas()" style="width:50%;">Create</button></div></div>
</div>

<script>
const SUPABASE_URL = "https://huppyicherwdhgxrcyav.supabase.co";
const SUPABASE_KEY = "sb_publishable_OJPFFYPGJrDUkjD-gVMOOw_GET4MdOW";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let realtimeChannel = null, currentJoinedClass = "", isTeacherHost = false;
let score = 0, currentRecordId = null, autoRefreshTimer = null;

/* THREE.JS 3D ENGINE */
let scene, camera, renderer;
let redWorm3D = { meshGroup: new THREE.Group(), segments: [], length: 10, x: -10, z: 0, angle: 0, speed: 0.15, color: 0xff5252 };
let blueWorm3D = { meshGroup: new THREE.Group(), segments: [], length: 10, x: 10, z: 0, angle: Math.PI, speed: 0.15, color: 0x2979ff };
let foods3D = [];

function init3DScene() {
  const container = document.getElementById("canvas3DContainer");
  container.innerHTML = "";
  
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x140b05);

  camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
  camera.position.set(0, 35, 25);
  camera.lookAt(0, 0, 0);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.appendChild(renderer.domElement);

  // Lighting
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
  scene.add(ambientLight);
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
  dirLight.position.set(10, 30, 10);
  scene.add(dirLight);

  // Ground Arena
  const groundGeo = new THREE.PlaneGeometry(40, 25);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x1f1108, roughness: 0.8 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  // Build 3D Worms
  buildWorm3D(redWorm3D);
  buildWorm3D(blueWorm3D);
  spawn3DFoods();

  animate3D();
}

function createCuteHead(colorHex) {
  const headGroup = new THREE.Group();
  
  // Head Sphere
  const geo = new THREE.SphereGeometry(0.8, 16, 16);
  const mat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.3 });
  const headMesh = new THREE.Mesh(geo, mat);
  headGroup.add(headMesh);

  // Cute Eyes (White + Black pupil)
  const eyeGeo = new THREE.SphereGeometry(0.25, 8, 8);
  const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const pupilGeo = new THREE.SphereGeometry(0.12, 8, 8);
  const pupilMat = new THREE.MeshBasicMaterial({ color: 0x000000 });

  // Left Eye
  const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
  leftEye.position.set(-0.35, 0.35, 0.65);
  const leftPupil = new THREE.Mesh(pupilGeo, pupilMat);
  leftPupil.position.set(-0.35, 0.35, 0.85);
  headGroup.add(leftEye); headGroup.add(leftPupil);

  // Right Eye
  const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
  rightEye.position.set(0.35, 0.35, 0.65);
  const rightPupil = new THREE.Mesh(pupilGeo, pupilMat);
  rightPupil.position.set(0.35, 0.35, 0.85);
  headGroup.add(rightEye); headGroup.add(rightPupil);

  return headGroup;
}

function buildWorm3D(worm) {
  scene.add(worm.meshGroup);
  worm.segments = [];
  
  for(let i=0; i<30; i++) {
    let mesh;
    if(i === 0) {
      mesh = createCuteHead(worm.color);
    } else {
      const scale = Math.max(0.3, 0.75 - (i * 0.015));
      const geo = new THREE.SphereGeometry(scale, 12, 12);
      const mat = new THREE.MeshStandardMaterial({ color: worm.color, roughness: 0.4 });
      mesh = new THREE.Mesh(geo, mat);
    }
    mesh.position.set(worm.x, 0.8, worm.z);
    worm.meshGroup.add(mesh);
    worm.segments.push(mesh);
  }
}

function spawn3DFoods() {
  foods3D.forEach(f => scene.remove(f.mesh));
  foods3D = [];
  const foodColors = [0xffca28, 0x8bc34a, 0xe91e63];
  for(let i=0; i<12; i++) {
    const geo = new THREE.SphereGeometry(0.4, 8, 8);
    const mat = new THREE.MeshStandardMaterial({ color: foodColors[i % 3], emissive: 0x333333 });
    const mesh = new THREE.Mesh(geo, mat);
    const x = (Math.random() - 0.5) * 34;
    const z = (Math.random() - 0.5) * 20;
    mesh.position.set(x, 0.4, z);
    scene.add(mesh);
    foods3D.push({ mesh: mesh, x: x, z: z });
  }
}

function animate3D() {
  requestAnimationFrame(animate3D);

  // Update Worm Physics & Steering AI
  [redWorm3D, blueWorm3D].forEach(w => {
    // Determine Target: If longer than rival, target rival's head!
    let rival = (w === redWorm3D) ? blueWorm3D : redWorm3D;
    let targetX, targetZ;

    if (w.length > rival.length) {
      // CHASE RIVAL WORM!
      targetX = rival.x;
      targetZ = rival.z;
    } else {
      // CHASE FOOD
      let f = foods3D[0] || {x: 0, z: 0};
      targetX = f.x; targetZ = f.z;
    }

    let dx = targetX - w.x;
    let dz = targetZ - w.z;
    w.angle = Math.atan2(dz, dx);

    let speed = (w.length > rival.length) ? 0.18 : 0.12;
    w.x += Math.cos(w.angle) * speed;
    w.z += Math.sin(w.angle) * speed;

    // Boundaries
    if(w.x < -18) w.x = 18; if(w.x > 18) w.x = -18;
    if(w.z < -11) w.z = 11; if(w.z > 11) w.z = -11;

    // Update Segments Position (Worm Smooth Follow)
    w.segments[0].position.set(w.x, 0.8, w.z);
    w.segments[0].rotation.y = -w.angle + Math.PI/2;

    for(let i = w.segments.length - 1; i > 0; i--) {
      if(i < w.length) {
        w.segments[i].visible = true;
        let prev = w.segments[i-1].position;
        w.segments[i].position.lerp(prev, 0.35);
      } else {
        w.segments[i].visible = false;
      }
    }

    // Food Collision
    foods3D.forEach((f, idx) => {
      if(Math.hypot(w.x - f.x, w.z - f.z) < 1.2) {
        w.length = Math.min(30, w.length + 1);
        f.x = (Math.random() - 0.5) * 34;
        f.z = (Math.random() - 0.5) * 20;
        f.mesh.position.set(f.x, 0.4, f.z);
      }
    });
  });

  // Chasing Clash (Bite segment)
  let dist = Math.hypot(redWorm3D.x - blueWorm3D.x, redWorm3D.z - blueWorm3D.z);
  if(dist < 1.8) {
    if(redWorm3D.length > blueWorm3D.length && blueWorm3D.length > 5) {
      redWorm3D.length += 1; blueWorm3D.length -= 1;
    } else if(blueWorm3D.length > redWorm3D.length && redWorm3D.length > 5) {
      blueWorm3D.length += 1; redWorm3D.length -= 1;
    }
  }

  document.getElementById("redLength").innerText = redWorm3D.length;
  document.getElementById("blueLength").innerText = blueWorm3D.length;

  renderer.render(scene, camera);
}

/* CEK INPUT & PENGUNCIAN TOMBOL PRESISI */
function cekInput() {
  const nama = document.getElementById("name").value.trim();
  const kelas = document.getElementById("class").value.trim().toUpperCase();
  const team = document.getElementById("teamSelect").value;
  const startBtn = document.getElementById("startBtn");
  const createClassBtn = document.getElementById("createClassBtn");
  const scoreboardBtn = document.getElementById("scoreboardBtn");

  if (team !== "") {
    createClassBtn.disabled = true; createClassBtn.style.display = "none";
    scoreboardBtn.disabled = true; scoreboardBtn.style.display = "none";

    if (nama !== "" && kelas !== "") {
      startBtn.disabled = true; startBtn.innerText = "⏳ WAITING FOR TEACHER...";
      connectRealtimeChannel(kelas, nama, team);
    }
  } else {
    if (!isTeacherHost) {
      createClassBtn.disabled = false; createClassBtn.style.display = "block";
      scoreboardBtn.disabled = false; scoreboardBtn.style.display = "inline-block";
    }
    startBtn.disabled = !(nama !== "" && kelas !== "");
    startBtn.innerText = "START GAME";
  }
}

function connectRealtimeChannel(classCode, pName = "", pTeam = "") {
  if (currentJoinedClass === classCode && realtimeChannel) {
    if (pName !== "") realtimeChannel.track({ name: pName, team: pTeam });
    return;
  }
  if (realtimeChannel) supabaseClient.removeChannel(realtimeChannel);
  currentJoinedClass = classCode;

  realtimeChannel = supabaseClient.channel('class-' + classCode, {
    config: { presence: { key: pName || 'host' } }
  });

  realtimeChannel
    .on('presence', { event: 'sync' }, () => updateLobbyUI(realtimeChannel.presenceState()))
    .on('broadcast', { event: 'start_battle' }, () => {
      if (!isTeacherHost) startQuizForStudent();
    })
    .subscribe(async (status) => {
      if (status === 'SUBSCRIBED' && pName !== "") {
        await realtimeChannel.track({ name: pName, team: pTeam });
      }
    });
}

function updateLobbyUI(state) {
  let redP = [], blueP = [];
  Object.keys(state).forEach(k => {
    state[k].forEach(p => {
      if (p.team === "🔴") redP.push(p.name);
      if (p.team === "🔵") blueP.push(p.name);
    });
  });

  document.getElementById("redTeamList").innerHTML = redP.map(n => `<div class="player-tag tag-red">🔴 ${n}</div>`).join('');
  document.getElementById("blueTeamList").innerHTML = blueP.map(n => `<div class="player-tag tag-blue">🔵 ${n}</div>`).join('');
}

function syncHostChannel() {
  const classCode = document.getElementById("filterClass").value.trim().toUpperCase();
  renderBoard();
  if (classCode !== "") {
    isTeacherHost = true;
    connectRealtimeChannel(classCode);
  }
}

async function triggerHostStartMatch() {
  const classCode = document.getElementById("filterClass").value.trim().toUpperCase();
  if (!classCode) return;

  isTeacherHost = true;
  connectRealtimeChannel(classCode);

  setTimeout(() => {
    if (realtimeChannel) {
      realtimeChannel.send({ type: 'broadcast', event: 'start_battle' });
      munculkanAlert("🚀 BATTLE STARTED!", "3D Worm Arena is Live on Board!");
      
      init3DScene();

      if(autoRefreshTimer) clearInterval(autoRefreshTimer);
      autoRefreshTimer = setInterval(renderBoard, 1000);
    }
  }, 300);
}

/* KUIS MODUL SISWA */
let currentAns = 0;
function startQuizForStudent() {
  document.getElementById("top-menu").classList.add("hidden");
  document.getElementById("quizArea").classList.remove("hidden");
  generateQuiz();
}

function generateQuiz() {
  let n1 = Math.floor(Math.random() * 20) + 1;
  let n2 = Math.floor(Math.random() * 20) + 1;
  currentAns = n1 + n2;
  document.getElementById("questionText").innerText = `${n1} + ${n2} = ?`;

  let opts = [currentAns, currentAns + 2, currentAns - 1, currentAns + 5].sort(() => Math.random() - 0.5);
  let html = "";
  opts.forEach(o => {
    html += `<button class="btn-blue" onclick="checkAnswer(${o})">${o}</button>`;
  });
  document.getElementById("answerOptions").innerHTML = html;
}

async function checkAnswer(val) {
  if (val === currentAns) {
    score += 10;
    document.getElementById("quizMsg").innerHTML = "<span style='color:#4caf50;'>✨ CORRECT! +10 (BOOSTED WORM!)</span>";
    let team = document.getElementById("teamSelect").value;
    if (team === "🔴") redWorm3D.length = Math.min(30, redWorm3D.length + 1);
    if (team === "🔵") blueWorm3D.length = Math.min(30, blueWorm3D.length + 1);
    syncScoreToDatabase();
  } else {
    document.getElementById("quizMsg").innerHTML = "<span style='color:#ff5252;'>❌ WRONG!</span>";
  }
  setTimeout(() => {
    document.getElementById("quizMsg").innerHTML = "";
    generateQuiz();
  }, 800);
}

async function syncScoreToDatabase() {
  let pName = document.getElementById("name").value.trim();
  let pTeam = document.getElementById("teamSelect").value;
  let pClass = document.getElementById("class").value.trim().toUpperCase();

  if(!currentRecordId) {
    const { data } = await supabaseClient.from("scores").insert([{
      name: pTeam + " " + pName, class: pClass, score: score, mode: "3dworm"
    }]).select();
    if(data && data.length > 0) currentRecordId = data[0].id;
  } else {
    await supabaseClient.from("scores").update({ score: score }).eq("id", currentRecordId);
  }
}

async function renderBoard() {
  const filter = document.getElementById("filterClass").value.trim().toUpperCase();
  let query = supabaseClient.from("scores").select("*").neq("name", "HOST_PIN");
  if(filter !== "") query = query.ilike("class", filter);
  
  let { data } = await query.order("score", { ascending:false }).limit(10);
  if(!data) return;

  document.getElementById("leaderboard").innerHTML = "<b>🏆 TOP PLAYERS</b><hr style='border:1px solid #3d2311;'>" +
    data.map((d,i) => `<div><b>${i+1}.</b> ${d.name} - <b style='color:#ffca28;'>${d.score}</b></div>`).join('');
}

function toggleBoard() {
  document.getElementById("boardPanel").classList.toggle("hidden");
  if(!document.getElementById("boardPanel").classList.contains("hidden")) {
    init3DScene();
  }
}

function bukaModalBuatKelas() { document.getElementById("modal-buat-kelas").style.display = "flex"; }
function tutupModalBuatKelas() { document.getElementById("modal-buat-kelas").style.display = "none"; }

async function prosesBuatKelas() {
  const pin = document.getElementById("input-pin-baru").value;
  if(pin.length < 3) return;

  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; 
  let code = "";
  for(let i=0; i<5; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));

  tutupModalBuatKelas();

  await supabaseClient.from("scores").insert([{ name: "HOST_PIN", class: code, score: 0, mode: pin }]);

  isTeacherHost = true;
  document.getElementById("createClassBtn").style.display = "none";
  document.getElementById("scoreboardBtn").style.display = "none";
  document.getElementById("top-menu").style.display = "none"; 
  document.getElementById("boardPanel").classList.remove("hidden");
  document.getElementById("filterClass").value = code;
  syncHostChannel();
  
  munculkanAlert("✅ Class Created!", `Class Code: <b style='font-size:32px; color:#ffca28;'>${code}</b>`);
}

function munculkanAlert(j, p) {
  document.getElementById("alert-title").innerHTML = j;
  document.getElementById("alert-msg").innerHTML = p;
  document.getElementById("custom-alert").style.display = "flex";
}
function tutupAlert() { document.getElementById("custom-alert").style.display = "none"; }
</script>
</body>
</html>
