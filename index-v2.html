<script>
const SUPABASE_URL = "https://huppyicherwdhgxrcyav.supabase.co";

let realtimeChannel = null, currentJoinedClass = "", isTeacherHost = false;

function updateTimerHUDPreview() {

/* WEB AUDIO API */
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function initAudio() {
  if (!audioCtx) audioCtx = new AudioContext();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playEatSound() {
  initAudio();
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(400, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.12);
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.12);
}

function playBiteSound() {
  initAudio();
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(280, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.2);
  gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.2);
}

/* CANVAS DUAL-ZONE TUG-OF-WAR ENGINE */
const canvas = document.getElementById("wormCanvas");
const ctx = canvas.getContext("2d");

let dividerX = canvas.width / 2;
let targetDividerX = canvas.width / 2;

let redWorm = { y: canvas.height / 2, waveOffset: 0, color: '#ff5252' };
let blueWorm = { y: canvas.height / 2, waveOffset: Math.PI, color: '#2979ff' };

function init2DArena() {
  if (animFrameReqId) cancelAnimationFrame(animFrameReqId);
  dividerX = canvas.width / 2;
  targetDividerX = canvas.width / 2;
  animate2D();
}

function pushTerritory(teamColor, pushAmount = 18) {
  if (teamColor === "🔴") {
    targetDividerX = Math.min(canvas.width - 30, targetDividerX + pushAmount);
    playEatSound();
  } else if (teamColor === "🔵") {
    targetDividerX = Math.max(30, targetDividerX - pushAmount);
    playBiteSound();
  }
}

function animate2D() {
  animFrameReqId = requestAnimationFrame(animate2D);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  dividerX += (targetDividerX - dividerX) * 0.1;

  ctx.fillStyle = "rgba(239, 68, 68, 0.12)"; ctx.fillRect(0, 0, dividerX, canvas.height);
  ctx.fillStyle = "rgba(41, 121, 255, 0.12)"; ctx.fillRect(dividerX, 0, canvas.width - dividerX, canvas.height);

  ctx.strokeStyle = "rgba(255,255,255,0.03)"; ctx.lineWidth = 1;
  for(let x=0; x<canvas.width; x+=25) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
  for(let y=0; y<canvas.height; y+=25) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); }

  ctx.beginPath(); ctx.moveTo(dividerX, 0); ctx.lineTo(dividerX, canvas.height);
  ctx.strokeStyle = "#ffca28"; ctx.lineWidth = 4; ctx.shadowBlur = 12; ctx.shadowColor = "#ffca28";
  ctx.stroke(); ctx.closePath(); ctx.shadowBlur = 0;

  if (isMatchActive) {
    redWorm.waveOffset += 0.08;
    blueWorm.waveOffset += 0.08;
  }

  drawTerritoryWorm(0, dividerX - 15, canvas.height / 2, redWorm.waveOffset, redWorm.color, true);
  drawTerritoryWorm(canvas.width, dividerX + 15, canvas.height / 2, blueWorm.waveOffset, blueWorm.color, false);

  let redPct = Math.round((dividerX / canvas.width) * 100);
  let bluePct = 100 - redPct;
  document.getElementById("redTerritoryPct").innerText = redPct;
  document.getElementById("blueTerritoryPct").innerText = bluePct;
}

function drawTerritoryWorm(startX, headX, centerY, waveOffset, colorHex, isFacingRight) {
  let segCount = 22;
  let points = [];

  for (let i = 0; i < segCount; i++) {
    let t = i / (segCount - 1);
    let x = startX + (headX - startX) * t;
    let wave = Math.sin(waveOffset + i * 0.35) * 12;
    let y = centerY + wave;
    points.push({ x: x, y: y });
  }

  for (let i = 0; i < points.length - 1; i++) {
    let p = points[i];
    let radius = Math.max(5, 14 * (i / segCount));
    ctx.beginPath(); ctx.arc(p.x, p.y, radius, 0, Math.PI * 2); ctx.fillStyle = colorHex; ctx.fill(); ctx.closePath();
  }

  let head = points[points.length - 1];
  ctx.beginPath(); ctx.arc(head.x, head.y, 15, 0, Math.PI * 2);
  ctx.fillStyle = colorHex; ctx.shadowBlur = 10; ctx.shadowColor = colorHex; ctx.fill(); ctx.closePath(); ctx.shadowBlur = 0;

  let eyeOffsetX = isFacingRight ? 5 : -5;
  ctx.fillStyle = "#ffffff";
  ctx.beginPath(); ctx.arc(head.x + eyeOffsetX, head.y - 5, 4, 0, Math.PI * 2); ctx.fill(); ctx.closePath();
  ctx.beginPath(); ctx.arc(head.x + eyeOffsetX, head.y + 5, 4, 0, Math.PI * 2); ctx.fill(); ctx.closePath();

  ctx.fillStyle = "#000000";
  let pupilOffsetX = isFacingRight ? 1.5 : -1.5;
  ctx.beginPath(); ctx.arc(head.x + eyeOffsetX + pupilOffsetX, head.y - 5, 2, 0, Math.PI * 2); ctx.fill(); ctx.closePath();
  ctx.beginPath(); ctx.arc(head.x + eyeOffsetX + pupilOffsetX, head.y + 5, 2, 0, Math.PI * 2); ctx.fill(); ctx.closePath();
}

async function triggerHostStartMatch() {
  const classCode = document.getElementById("filterClass").value.trim().toUpperCase();
  if (!classCode) return;

  isTeacherHost = true;
  initAudio();
  connectRealtimeChannel(classCode);

  const selectedDuration = parseInt(document.getElementById("matchTimerSelect").value) || 60;
  const selectedSchoolLevel = document.getElementById("schoolLevelSelect").value;

  setTimeout(() => {
    if (realtimeChannel) {
      realtimeChannel.send({ 
        type: 'broadcast', 
        event: 'start_battle',
        payload: { duration: selectedDuration, level: selectedSchoolLevel }
      });
      
      init2DArena();
      isMatchActive = true;
      timeLeft = selectedDuration;
      document.getElementById("timerHUD").innerText = `⏱️ ${timeLeft}s`;

      clearInterval(matchTimer);
      matchTimer = setInterval(() => {
        timeLeft--;
        document.getElementById("timerHUD").innerText = `⏱️ ${timeLeft}s`;
        if (timeLeft <= 0) {
          clearInterval(matchTimer);
          endMatchBattle();
        }
      }, 1000);

      if(autoRefreshTimer) clearInterval(autoRefreshTimer);
      autoRefreshTimer = setInterval(renderBoard, 1000);
    }
  }, 300);
}

function endMatchBattle() {
  isMatchActive = false;
  let winnerTitle = "", winningTeamEmoji = "";
  let redPct = Math.round((dividerX / canvas.width) * 100);

  if (redPct > 50) { winnerTitle = "🏆 RED WORM WINS THE TERRITORY!"; winningTeamEmoji = "🔴"; }
  else if (redPct < 50) { winnerTitle = "🏆 BLUE WORM WINS THE TERRITORY!"; winningTeamEmoji = "🔵"; }
  else { winnerTitle = "🤝 IT'S A PERFECT DRAW!"; winningTeamEmoji = "DRAW"; }

  if (realtimeChannel) {
    realtimeChannel.send({
      type: 'broadcast', event: 'end_battle',
      payload: { winnerTitle: winnerTitle, winningTeamEmoji: winningTeamEmoji, redPct: redPct, bluePct: 100 - redPct }
    });
  }
  munculkanAlert("🏁 TIME'S UP!", `${winnerTitle}<br><br>Red Territory: <b>${redPct}%</b><br>Blue Territory: <b>${100 - redPct}%</b>`);
}

function cekInput() {
  const nama = document.getElementById("name").value.trim();
  const kelas = document.getElementById("class").value.trim().toUpperCase();
  const team = document.getElementById("teamSelect").value;
  const startBtn = document.getElementById("startBtn");
  const createClassBtn = document.getElementById("createClassBtn");
  const scoreboardBtn = document.getElementById("scoreboardBtn");

  if (team !== "") {
    createClassBtn.disabled = true; createClassBtn.style.display = "none";
    scoreboardBtn.disabled = true; scoreboardBtn.style.display = "none";

    if (nama !== "" && kelas !== "") {
      startBtn.disabled = true; startBtn.innerText = "⏳ WAITING FOR TEACHER...";
      connectRealtimeChannel(kelas, nama, team);
    }
  } else {
    if (!isTeacherHost) {
      createClassBtn.disabled = false; createClassBtn.style.display = "block";
      scoreboardBtn.disabled = false; scoreboardBtn.style.display = "inline-block";
    }
    startBtn.disabled = !(nama !== "" && kelas !== "");
    startBtn.innerText = "START GAME";
  }
}

function connectRealtimeChannel(classCode, pName = "", pTeam = "") {
  if (currentJoinedClass === classCode && realtimeChannel) {
    if (pName !== "") realtimeChannel.track({ name: pName, team: pTeam });
    return;
  }
  if (realtimeChannel) supabaseClient.removeChannel(realtimeChannel);
  currentJoinedClass = classCode;

  realtimeChannel = supabaseClient.channel('class-' + classCode, {
    config: { presence: { key: pName || 'host' } }
  });

  realtimeChannel
    .on('presence', { event: 'sync' }, () => updateLobbyUI(realtimeChannel.presenceState()))
    .on('broadcast', { event: 'start_battle' }, (payload) => {
      if (!isTeacherHost) {
        const dur = (payload && payload.payload && payload.payload.duration) ? payload.payload.duration : 60;
        const lev = (payload && payload.payload && payload.payload.level) ? payload.payload.level : "SD";
        activeSchoolLevel = lev;
        startQuizForStudent(dur);
      }
    })
    .on('broadcast', { event: 'student_correct_answer' }, (payload) => {
      if (isTeacherHost) {
        pushTerritory(payload.payload.team, payload.payload.pushAmount);
      }
    })
    .on('broadcast', { event: 'end_battle' }, (payload) => {
      if (!isTeacherHost) {
        handleStudentGameOver(payload.payload);
      }
    })
    .subscribe(async (status) => {
      if (status === 'SUBSCRIBED' && pName !== "") {
        await realtimeChannel.track({ name: pName, team: pTeam });
      }
    });
}

function updateLobbyUI(state) {
  let redP = [], blueP = [];
  Object.keys(state).forEach(k => {
    state[k].forEach(p => {
      if (p.team === "🔴") redP.push(p.name);
      if (p.team === "🔵") blueP.push(p.name);
    });
  });

  document.getElementById("redTeamList").innerHTML = redP.map(n => `<div class="player-tag tag-red">🔴 ${n}</div>`).join('');
  document.getElementById("blueTeamList").innerHTML = blueP.map(n => `<div class="player-tag tag-blue">🔵 ${n}</div>`).join('');
}

function syncHostChannel() {
  const classCode = document.getElementById("filterClass").value.trim().toUpperCase();
  renderBoard();
  if (classCode !== "") {
    isTeacherHost = true;
    connectRealtimeChannel(classCode);
  }
}

/* GENERATOR SOAL KUIS ACAK DENGAN PORSI LEVEL BALANCED */
let currentAns = 0;
let currentQuestionPoint = 10;
let currentPushAmount = 15;

function startQuizForStudent(duration) {
  document.getElementById("top-menu").classList.add("hidden");
  document.getElementById("quizArea").classList.remove("hidden");
  
  let studentTimeLeft = duration;
  document.getElementById("studentTimerDisplay").innerText = `⏱️ Time: ${studentTimeLeft}s`;
  
  clearInterval(studentTimerInterval);
  studentTimerInterval = setInterval(() => {
    studentTimeLeft--;
    if (studentTimeLeft >= 0) {
      document.getElementById("studentTimerDisplay").innerText = `⏱️ Time: ${studentTimeLeft}s`;
    } else {
      clearInterval(studentTimerInterval);
    }
  }, 1000);

  generateBalancedQuiz();
}

function generateBalancedQuiz() {
  // ACAK LEVEL KESULITAN DENGAN PORSI SEIMBANG (33% EASY, 34% MEDIUM, 33% HARD)
  let rand = Math.random();
  let diff = "easy";
  if (rand > 0.66) diff = "hard";
  else if (rand > 0.33) diff = "medium";

  const badgeEl = document.getElementById("levelBadgeDisplay");
  if (diff === "easy") {
    badgeEl.className = "level-badge level-easy"; badgeEl.innerText = "EASY (+10)";
    currentQuestionPoint = 10; currentPushAmount = 15;
  } else if (diff === "medium") {
    badgeEl.className = "level-badge level-medium"; badgeEl.innerText = "MEDIUM (+15)";
    currentQuestionPoint = 15; currentPushAmount = 25;
  } else {
    badgeEl.className = "level-badge level-hard"; badgeEl.innerText = "HARD (+25)";
    currentQuestionPoint = 25; currentPushAmount = 40;
  }

  let qText = "", ans = 0, fakeOpts = [];

  if (activeSchoolLevel === "SD") {
    if (diff === "easy") {
      let a = Math.floor(Math.random() * 20) + 5, b = Math.floor(Math.random() * 20) + 5;
      qText = `${a} + ${b} = ?`; ans = a + b;
    } else if (diff === "medium") {
      let a = Math.floor(Math.random() * 12) + 2, b = Math.floor(Math.random() * 9) + 2;
      qText = `${a} × ${b} = ?`; ans = a * b;
    } else {
      let a = Math.floor(Math.random() * 45) + 15, b = Math.floor(Math.random() * 15) + 5;
      qText = `${a} - ${b} = ?`; ans = a - b;
    }
  } else if (activeSchoolLevel === "SMP") {
    if (diff === "easy") {
      let x = Math.floor(Math.random() * 10) + 2, b = Math.floor(Math.random() * 8) + 1;
      qText = `Jika x = ${x}, berapa nilai (2x + ${b})?`; ans = 2 * x + b;
    } else if (diff === "medium") {
      let x = Math.floor(Math.random() * 8) + 2;
      qText = `Hasil dari ${x}² + 5 = ?`; ans = Math.pow(x, 2) + 5;
    } else {
      let a = Math.floor(Math.random() * 10) + 2, b = Math.floor(Math.random() * 10) + 2;
      qText = `FPB dari ${a * 4} dan ${a * 6} adalah?`; ans = a * 2;
    }
  } else if (activeSchoolLevel === "SMA") {
    if (diff === "easy") {
      let base = 2, exp = Math.floor(Math.random() * 4) + 2;
      qText = `Nilai dari ²log(${Math.pow(base, exp)}) adalah?`; ans = exp;
    } else if (diff === "medium") {
      let degs = [30, 45, 60], d = degs[Math.floor(Math.random() * degs.length)];
      if (d === 30) { qText = `2 × sin(30°) = ?`; ans = 1; }
      else if (d === 45) { qText = `tan(45°) + 3 = ?`; ans = 4; }
      else { qText = `2 × cos(60°) = ?`; ans = 1; }
    } else {
      let a = Math.floor(Math.random() * 5) + 2;
      qText = `Jika f(x) = ${a}x² - 3, berapa f(3)?`; ans = a * 9 - 3;
    }
  }

  currentAns = ans;
  document.getElementById("questionText").innerText = qText;

  fakeOpts = [ans, ans + 2, ans - 1, ans + 5].sort(() => Math.random() - 0.5);
  let html = "";
  fakeOpts.forEach(o => { html += `<button class="btn-blue" onclick="checkAnswer(${o})">${o}</button>`; });
  document.getElementById("answerOptions").innerHTML = html;
}

async function checkAnswer(val) {
  let team = document.getElementById("teamSelect").value;
  if (val === currentAns) {
    score += currentQuestionPoint;
    document.getElementById("quizMsg").innerHTML = `<span style='color:#4caf50;'>✨ CORRECT! +${currentQuestionPoint} PTS (POWER PUSH!)</span>`;
    
    if (realtimeChannel) {
      realtimeChannel.send({
        type: 'broadcast',
        event: 'student_correct_answer',
        payload: { team: team, pushAmount: currentPushAmount }
      });
    }
    syncScoreToDatabase();
  } else {
    document.getElementById("quizMsg").innerHTML = "<span style='color:#ff5252;'>❌ WRONG!</span>";
  }
  setTimeout(() => {
    document.getElementById("quizMsg").innerHTML = "";
    generateBalancedQuiz();
  }, 850);
}

function handleStudentGameOver(data) {
  clearInterval(studentTimerInterval);
  const myTeam = document.getElementById("teamSelect").value;
  let resultStatusText = "";

  if (data.winningTeamEmoji === "DRAW") { resultStatusText = "🤝 GAME DRAW!"; }
  else if (data.winningTeamEmoji === myTeam) { resultStatusText = "🎉 YOUR TEAM WON THE BATTLE!"; }
  else { resultStatusText = "💔 YOUR TEAM LOST!"; }

  const alertCloseBtn = document.getElementById("alertCloseBtn");
  alertCloseBtn.innerText = "🔄 Reset & Ready for Next Round";
  alertCloseBtn.onclick = resetStudentToLobby;

  munculkanAlert("🏁 TIME'S UP!", 
    `<b style='font-size:20px; color:#ffca28;'>${resultStatusText}</b><br><br>` +
    `Your Final Score: <b style='color:#4caf50; font-size:24px;'>${score}</b><br>` +
    `<small>Red Territory: ${data.redPct}% | Blue Territory: ${data.bluePct}%</small>`
  );
}

function resetStudentToLobby() {
  tutupAlert();
  document.getElementById("quizArea").classList.add("hidden");
  document.getElementById("top-menu").classList.remove("hidden");
  
  const alertCloseBtn = document.getElementById("alertCloseBtn");
  alertCloseBtn.innerText = "Close";
  alertCloseBtn.onclick = tutupAlert;

  score = 0;
  currentRecordId = null;
  cekInput();
}

async function syncScoreToDatabase() {
  let pName = document.getElementById("name").value.trim();
  let pTeam = document.getElementById("teamSelect").value;
  let pClass = document.getElementById("class").value.trim().toUpperCase();

  if(!currentRecordId) {
    const { data } = await supabaseClient.from("scores").insert([{
      name: pTeam + " " + pName, class: pClass, score: score, mode: "2dtugofwar"
    }]).select();
    if(data && data.length > 0) currentRecordId = data[0].id;
  } else {
    await supabaseClient.from("scores").update({ score: score }).eq("id", currentRecordId);
  }
}

async function renderBoard() {
  const filter = document.getElementById("filterClass").value.trim().toUpperCase();
  let query = supabaseClient.from("scores").select("*").neq("name", "HOST_PIN");
  if(filter !== "") query = query.ilike("class", filter);
  
  let { data } = await query.order("score", { ascending:false }).limit(10);
  if(!data) return;

  document.getElementById("leaderboard").innerHTML = "<b>🏆 TOP PLAYERS</b><hr style='border:1px solid #3d2311;'>" +
    data.map((d,i) => `<div><b>${i+1}.</b> ${d.name} - <b style='color:#ffca28;'>${d.score}</b></div>`).join('');
}

function toggleBoard() {
  document.getElementById("boardPanel").classList.toggle("hidden");
  if(!document.getElementById("boardPanel").classList.contains("hidden")) {
    init2DArena();
    updateTimerHUDPreview();
  }
}

function bukaModalBuatKelas() { document.getElementById("modal-buat-kelas").style.display = "flex"; }
function tutupModalBuatKelas() { document.getElementById("modal-buat-kelas").style.display = "none"; }

async function prosesBuatKelas() {
  const pin = document.getElementById("input-pin-baru").value;
  if(pin.length < 3) return;

  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; 
  let code = "";
  for(let i=0; i<5; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));

  tutupModalBuatKelas();

  await supabaseClient.from("scores").insert([{ name: "HOST_PIN", class: code, score: 0, mode: pin }]);

  isTeacherHost = true;
  document.getElementById("createClassBtn").style.display = "none";
  document.getElementById("scoreboardBtn").style.display = "none";
  document.getElementById("top-menu").style.display = "none"; 
  document.getElementById("boardPanel").classList.remove("hidden");
  document.getElementById("filterClass").value = code;
  syncHostChannel();
  
  munculkanAlert("✅ Class Created!", `Class Code: <b style='font-size:32px; color:#ffca28;'>${code}</b>`);
}

function munculkanAlert(j, p) {
  document.getElementById("alert-title").innerHTML = j;
  document.getElementById("alert-msg").innerHTML = p;
  document.getElementById("custom-alert").style.display = "flex";
}
function tutupAlert() { document.getElementById("custom-alert").style.display = "none"; }
</script>
</body>
</html>
